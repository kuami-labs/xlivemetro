packages:
  - apps/*
  - services/*
  - packages/*

# Scripts d'installation des dépendances : autorisés (true) ou refusés (false) après relecture
allowBuilds:
  '@prisma/engines': true
  prisma: true
  # Buf : le script ne fait que vérifier le binaire, déjà fourni par la dépendance optionnelle
  # de la plateforme (@bufbuild/buf-linux-x64…) ; script relu, inutile
  '@bufbuild/buf': false

# Correctifs de sécurité de dépendances transitives (alertes Dependabot).
# À retirer quand l'amont aura suivi (prisma > 7.10.1).
overrides:
  # GHSA-7589-6fvf-x4pw : @prisma/config@7.10.1 fige effect@3.20.0
  '@prisma/config>effect': ^3.22.1
